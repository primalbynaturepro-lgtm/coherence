<head>

<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">

<title>Cohérence · atelier</title>
<style>
  :root { --bg:#0A0908; --s1:#12100D; --line:#2A251D; --tx:#F4EDDC; --mu:#A39887; --gold:#D9AA52; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width: 430px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 18px 0 2px; font-weight: 600; }
  p { margin: 6px 0; color: var(--mu); }
  a.tool { display:block; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 10px 0; color: var(--tx); text-decoration: none; }
  a.tool b { display:block; font-weight: 600; }
  a.tool span { color: var(--mu); font-size: 14px; }
  a.app { display:block; text-align:center; background: var(--gold); color: var(--bg); font-weight: 600; text-decoration:none; border-radius: 14px; padding: 14px 16px; margin: 22px 0 10px; }
  .fine { font-size: 13px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Atelier</h1>
  <p>Deux outils pour toi, pas pour l'app de tous les jours.</p>

  <a class="tool" href="/lab/data.html"><b>Tes données</b><span>Une copie de sauvegarde, ou la remettre en place.</span></a>

  <p class="fine">Cohérence · <span id="v"></span></p>
</main>
<script src="/js/version.js"></script>
<script>document.getElementById('v').textContent = (window.COH && COH.VERSION) || '';</script>

</html>
